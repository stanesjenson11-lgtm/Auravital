org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
# Some plugins (e.g. tflite_flutter) pin Java to JVM 11 while their Kotlin tasks
# follow the JDK (21), which trips Kotlin 2.2's strict JVM-target check. The
# class-file version is irrelevant after D8/R8 dexing, so downgrade to a warning.
kotlin.jvm.target.validation.mode=warning
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
