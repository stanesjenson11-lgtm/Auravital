name: auravitals
description: AI-powered passive health monitoring that runs fully on-device.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.3.2
  go_router: ^17.3.0
  drift: ^2.34.0
  drift_flutter: ^0.3.0
  flutter_secure_storage: ^10.3.1
  permission_handler: ^12.0.3
  workmanager: ^0.9.0+3
  flutter_local_notifications: ^22.0.1
  tflite_flutter: ^0.12.1
  fl_chart: ^1.2.0
  intl: ^0.20.2
  path_provider: ^2.1.5
  share_plus: ^13.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.5.4
  drift_dev: ^2.34.0

flutter:
  uses-material-design: true
